unbind-key C-b
set -g prefix C-s
bind-key C-s send-prefix

set -g mouse on
set -g detach-on-destroy off
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on
# set-option -g allow-passthrough on
set -g status-style "fg=blue"
set -g window-status-current-style "fg=blue bold"
set -g status-left-length 100
set -g status-right-length 100

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Open panes in current working directory
bind c neww -c "#{pane_current_path}"
bind - split-window -c "#{pane_current_path}"
bind '\' split-window -h -c "#{pane_current_path}"

# Set vi-mode and paste binds
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Other bindings
bind C-p previous-window
bind C-n next-window
bind C-s switch-client -l

bind-key x kill-pane
bind-key X kill-session

bind-key -r r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

bind-key -r f display-popup -E -B -w 100% -h 100% "tmux-sessionizer"
bind-key -r a display-popup -E -w 80% -h 80% "nvim ~/dev/notes.md -c 'set wrap'"
bind-key -r j display-popup -E "jrnl"
bind-key -r u run-shell -b "tmux capture-pane -J -p | grep -oE '(https?):\/\/.*[^>]' | fzf-tmux -d20 --multi --bind alt-a:select-all,alt-d:deselect-all | xargs open"
# bind-key l send-keys C-l \; clear-history
bind-key l send-keys C-l \; clear-history \; run-shell -b "rm ~/.zsh_history"

run '~/.config/tmux/plugins/tpm/tpm'
